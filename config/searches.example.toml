# Your job searches. Check them in the tracker's Searches tab (jobflow web).
# After each edit, run: uv run jobflow update-searches

[defaults]
sites = [
    "linkedin",
    "indeed",
    "seek",
]
posted_within_days = 1
max_results = 500
exclude_title_terms = [
]
include_title_terms = [
]
exclude_companies = [
]

[[search]]
name = "data-analyst-au"
terms = [
    "data analyst",
    "business intelligence analyst",
]
locations = { AU = ["Sydney"] }
salary_min = 100_000
salary_period = "annual"
job_types = [            # full-time, part-time, contract, casual
    "full-time",
]
work_arrangements = [    # on-site, hybrid, remote
    "on-site",
    "hybrid",
    "remote",
]
seek_classifications = [
    "information-communication-technology",
    "banking-financial-services-analysis-reporting",
]
