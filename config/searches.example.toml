# Copy to config/searches.toml (ignored by Git) and edit. Check it with:
#   jobflow web, then the Searches tab: checks this file, shows the Apify runs it would
#   make (costs nothing), and lists allowed values and which site applies which filter.
# GitHub Actions reads the same text from the JOBFLOW_SEARCHES repository variable. After
# each edit, update it (and apply excluded titles to your Inbox) with:
#   uv run jobflow update-searches

[defaults]
sites = [
    "linkedin",
    "indeed",
    "seek",
]
posted_within_days = 1
max_results = 50
exclude_title_terms = [

]
include_title_terms = [
    
]

[[search]]
name = "data-analyst-au"
terms = [
    "data analyst",
    "business intelligence analyst",
]
salary_min = 100_000
salary_period = "annual"
job_types = [            # full-time, part-time, contract, casual
    "full-time",
]
work_arrangements = [    # on-site, hybrid, remote
    "on-site",
    "hybrid",
    "remote",
]
seek_classifications = [
    "information-communication-technology",
    "banking-financial-services-analysis-reporting",
]

[search.locations]
AU = [
    "Sydney",
]
