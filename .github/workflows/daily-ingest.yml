name: Daily job ingestion

on:
  schedule:
    - cron: "30 14 * * *" # 00:30 daily in Sydney standard time; 01:30 during daylight time.
  workflow_dispatch:

permissions:
  contents: read

# Never let a slow run overlap the next day's run.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Actions are pinned to exact commits, not tags: a tag can be moved to other code,
      # which would then run with this job's database and Apify secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --no-dev --no-group documents
      - run: uv run --no-sync jobflow ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          JOBFLOW_SEARCHES: ${{ vars.JOBFLOW_SEARCHES }}
