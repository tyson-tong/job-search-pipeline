name: Daily job ingestion

on:
  schedule:
    # 00:17 daily in Sydney standard time; 01:17 during daylight time. Off the hour and half
    # hour, when GitHub is busiest and starts scheduled runs latest: with a 24-hour posted
    # window, a run that starts hours late misses the jobs posted in those hours.
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never let a slow run overlap the next day's run.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Actions are pinned to exact commits, not tags: a tag can be moved to other code,
      # which would then run with this job's database and Apify secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # nothing here pushes, so don't leave the token in .git
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --no-dev --no-group documents
      - run: uv run --no-sync jobflow ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          JOBFLOW_SEARCHES: ${{ vars.JOBFLOW_SEARCHES }}
          JOBFLOW_TIMEZONE: ${{ vars.JOBFLOW_TIMEZONE }}
