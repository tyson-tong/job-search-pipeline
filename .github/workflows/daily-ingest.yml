name: Daily job ingestion

on:
  schedule:
    - cron: "30 20 * * *" # 06:30 daily in Sydney standard time; 07:30 during daylight time.
  workflow_dispatch:

permissions:
  contents: read

# Never let a slow run overlap the next day's run.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run --no-sync jobflow migrate && uv run --no-sync jobflow ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          JOBFLOW_SEARCHES: ${{ vars.JOBFLOW_SEARCHES }}
