name: Daily job ingestion

on:
  # Started on time, at night, by an outside cron service through GitHub's API (docs/setup.md,
  # section 7): Seek's 1-day search returns only today's listings, so the import must start
  # shortly before midnight. Also the Actions tab's "Run workflow" button.
  workflow_dispatch:
  schedule:
    # The fallback for a day the outside service missed, or a copy without one: 00:17 daily
    # in Sydney standard time, 01:17 during daylight time. GitHub starts scheduled runs late
    # whatever the time (4 to 8 hours in October 2026, a different amount each day), so such
    # a run misses some hours on LinkedIn, whose 24-hour window is searched as 25 hours
    # (ingest/options.py), and most of the day before on Seek.
    - cron: "17 14 * * *"

permissions:
  contents: read

# Never let a slow run overlap the next day's run.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  # A scheduled run imports nothing when a run started on time succeeded in the last 20 hours:
  # it would pay Apify again for the same jobs. Concurrency makes it wait for one still going.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    steps:
      - id: recent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          last=$(gh run list --workflow daily-ingest.yml --event workflow_dispatch \
            --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 72000 ]; then
            echo "A run started on time succeeded at $last, so this scheduled run imports nothing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  ingest:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Actions are pinned to exact commits, not tags: a tag can be moved to other code,
      # which would then run with this job's database and Apify secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes, so don't leave the token in .git
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --no-dev --no-group documents
      - run: uv run --no-sync jobflow ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          JOBFLOW_SEARCHES: ${{ vars.JOBFLOW_SEARCHES }}
          JOBFLOW_TIMEZONE: ${{ vars.JOBFLOW_TIMEZONE }}
          # Optional; unset, it is empty and the default (30) applies.
          APIFY_MAX_WAIT_MINUTES: ${{ vars.APIFY_MAX_WAIT_MINUTES }}
