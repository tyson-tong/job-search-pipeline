name: Tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway PostgreSQL for tests/test_db.py, which run only when TEST_DATABASE_URL
    # is set. It holds nothing and is gone when the job ends.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # Pinned to exact commits, as in daily-ingest.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
