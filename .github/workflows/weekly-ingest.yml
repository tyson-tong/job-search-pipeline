name: Weekly job ingestion

on:
  schedule:
    - cron: "30 20 * * 0" # 06:30 Monday in Sydney standard time; 07:30 during daylight time.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: jobflow migrate && jobflow ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_IDS: ${{ vars.APIFY_TASK_IDS }}
