# Copy to searches.toml (ignored by Git) and edit. Check it with:
#   jobflow searches          # shows the Apify runs it would make; costs nothing
#   jobflow options           # allowed values, and which site applies which filter
# GitHub Actions reads the same text from the JOBFLOW_SEARCHES repository variable:
#   gh variable set JOBFLOW_SEARCHES < searches.toml

# Settings every search inherits unless it sets its own.
[defaults]
# Job sites to search: any of "linkedin", "indeed", "seek". Unlisted sites are never
# called (so cost nothing). A search can override this with its own sites = [...].
sites = ["linkedin", "indeed", "seek"]
# 1 (24 hours), 7 (1 week), 14 (2 weeks), or 30 (1 month). Use 1 for the daily schedule;
# a longer window is useful for a first run. LinkedIn has no 2-week option and Indeed no
# 1-month option: those sites search wider and older jobs are filtered after import.
posted_within_days = 1
max_results = 50           # per Apify run (LinkedIn: per term and location). Caps cost.
# max_cost_usd = 1.00      # optional hard cap per Apify run, in USD

[[search]]
name = "data-analyst"
# Each term is searched separately on each site.
terms = ["data analyst", "business intelligence analyst"]
# ISO country code = list of cities; an empty list searches the whole country.
locations = { AU = ["Sydney", "Melbourne"], NZ = [] }
# radius_km = 25

# Salary range in the posting's local currency. Jobs that don't list a salary are
# always kept. Seek filters on its site; LinkedIn and Indeed jobs are filtered after
# import. Either bound may be left out.
salary_min = 100000
salary_max = 160000
salary_period = "annual"   # annual | monthly | hourly

job_types = ["full-time", "contract"]            # full-time | part-time | contract | casual
work_arrangements = ["hybrid", "remote"]         # on-site | hybrid | remote

# Seek only (LinkedIn and Indeed have no equivalent; your terms do that job there).
# A top-level key includes all its subclassifications: jobflow options classifications
classifications = ["information-communication-technology", "banking-financial-services-analysis-reporting"]

# A second search can use different sites and filters, e.g.:
# [[search]]
# name = "legal-counsel"
# terms = ["legal counsel"]
# sites = ["seek", "linkedin"]
# locations = { AU = ["Sydney"] }
# classifications = ["legal"]
