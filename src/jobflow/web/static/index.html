<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The per-start token app.js sends with every API call; filled in by the server. -->
<meta name="jobflow-token" content="__JOBFLOW_TOKEN__">
<link rel="icon" href="data:,">
<title>Job Tracker</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --ink: #18202b; --muted: #5d6876; --line: #dde2e8;
  --accent: #1f5fae; --accent-ink: #fff; --soft: #e8effa; --dirty: #fff6dd; --dirty-line: #e7c35a;
  --warn: #a14e00; --warn-soft: #fdeede; --bad: #b3261e; --good: #2f7d43; --chip: #eef1f5;
  --shadow: 0 8px 30px #0f172a26;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121519; --panel: #1b2027; --ink: #e6e9ed; --muted: #9aa4b0; --line: #2e3640;
    --accent: #6ea6ee; --accent-ink: #0d1117; --soft: #1e2b3d; --dirty: #33291299; --dirty-line: #8a6d1f;
    --warn: #f0a560; --warn-soft: #3a2a18; --bad: #ff8a80; --good: #7fd08f; --chip: #252c35;
    --shadow: 0 8px 30px #0008;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
header h1 { font-size: 1.1rem; margin: 0 8px 0 0; }
.pipeline { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.chip { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 2px 10px;
  font-size: 0.82rem; }
.chip b { font-variant-numeric: tabular-nums; }
.chip.alert { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.save-bar { display: flex; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.small { padding: 2px 8px; font-size: 0.82rem; }
main { padding: 12px 16px 60px; max-width: 1500px; margin: 0 auto; }
.tabs { display: flex; gap: 4px; margin-bottom: 10px; }
.notice { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 8px;
  padding: 8px 12px; margin-bottom: 10px; }
.tab { border: 0; background: none; padding: 8px 14px; border-bottom: 2px solid transparent; font-weight: 600; color: var(--muted); }
.tab.on { color: var(--ink); border-color: var(--accent); }
.count { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; font-size: 0.75rem; margin-left: 4px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.filters input, .filters select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 9px; }
.filters input[type=search] { min-width: 220px; flex: 1; max-width: 360px; }
.pager { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
.pager[hidden] { display: none; }
details.multi { position: relative; }
details.multi summary { list-style: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
details.multi summary::-webkit-details-marker { display: none; }
details.multi .menu { position: absolute; z-index: 6; top: calc(100% + 4px); left: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: var(--shadow); min-width: 210px; }
details.multi label { display: flex; gap: 8px; padding: 4px 6px; border-radius: 6px; }
details.multi label:hover { background: var(--soft); }
.menu .row { display: flex; gap: 6px; margin-top: 6px; }
.meta { color: var(--muted); font-size: 0.85rem; }
.table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); background: var(--panel); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
/* Column filters: a second heading row, not sticky, with compact inputs. */
tr.col-filters th { position: static; padding-top: 0; text-transform: none; letter-spacing: 0; font-weight: normal; }
tr.col-filters input, tr.col-filters select { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--panel);
  border-radius: 6px; padding: 3px 5px; font-size: 0.82rem; }
tr.col-filters input[type=number] { min-width: 70px; }
tr.col-filters details.multi summary { padding: 3px 5px; font-size: 0.82rem; border-radius: 6px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
tr.col-filters details.multi .menu { max-height: 320px; overflow-y: auto; }
tr.col-filters .menu input[type=checkbox] { width: auto; }
tr.col-filters .menu label { white-space: nowrap; }
.sort-head { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.sort-head:hover { color: var(--accent); }
.sort-head.on { color: var(--ink); }
tr.dirty td { background: var(--dirty); }
tr.dirty td:first-child { box-shadow: inset 3px 0 0 var(--dirty-line); }
/* Similar jobs sit together: an orange bar marks similar jobs in one country, a blue one the
   same ad in another country, with a line above each set. */
tr.abroad td:first-child { border-left: 4px solid var(--accent); }
tr.grouped td:first-child { border-left: 4px solid var(--warn); }
tr.grouped.group-start td { border-top: 2px solid var(--warn); }
tr.abroad.area-start td { border-top: 2px solid var(--accent); }
.score { display: inline-block; min-width: 36px; text-align: center; border-radius: 6px; padding: 1px 6px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--chip); }
.score.hi { background: #d9f2df; color: #1d5e30; } .score.mid { background: #fdf1d4; color: #7a5300; } .score.lo { background: #f6dede; color: #8a1f1a; }
@media (prefers-color-scheme: dark) { .score.hi { background: #1f3b27; color: #9ee0ad; } .score.mid { background: #3b3119; color: #f3cf7a; } .score.lo { background: #3c2222; color: #ffb4ad; } }
.title-btn { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; color: var(--ink); }
.title-btn:hover { color: var(--accent); text-decoration: underline; }
.flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.flag { font-size: 0.72rem; border-radius: 4px; padding: 0 5px; background: var(--chip); color: var(--muted); }
.flag.warn { background: var(--warn-soft); color: var(--warn); }
.flag.bad { background: var(--warn-soft); color: var(--bad); font-weight: 600; }
.site { font-size: 0.72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 3px; }
td select, td input[type=date] { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 5px; }
.quick { display: flex; gap: 4px; flex-wrap: wrap; }
.btn.on { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
th.sel, td.sel { width: 1%; padding-right: 0; }
td.sel { cursor: pointer; user-select: none; }
/* Pinned to the bottom so it stays in reach while ticking rows down a long Inbox. */
.bulk { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 8; max-width: calc(100vw - 32px);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--accent);
  border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
/* Drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel);
  border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 10; overflow-y: auto; padding: 18px 20px 40px; }
.drawer[hidden] { display: none; }
.drawer h2 { margin: 0 30px 2px 0; font-size: 1.2rem; }
.drawer h3 { font-size: 0.95rem; margin: 18px 0 6px; }
.drawer-actions { position: sticky; bottom: -40px; margin: 20px -20px -40px; padding: 12px 20px;
  background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.close { position: absolute; top: 12px; right: 14px; border: 0; background: none; font-size: 1.4rem; line-height: 1; color: var(--muted); }
.edit { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; background: var(--soft); border-radius: 10px; padding: 12px; margin-top: 12px; }
.edit textarea { grid-column: 1 / -1; min-height: 70px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--panel); resize: vertical; }
.edit select, .edit input { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--panel); }
.banner { border-radius: 8px; padding: 8px 10px; margin-top: 10px; background: var(--warn-soft); color: var(--warn); }
.notes { white-space: pre-wrap; background: var(--chip); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; }
.match { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
.match ul { margin: 4px 0 0; padding-left: 18px; font-size: 0.86rem; }
.match .q { color: var(--muted); }
.history li, .dups li { margin: 3px 0; }
.description { white-space: pre-wrap; font-size: 0.88rem; max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.chip.busy { background: var(--soft); border-color: var(--accent); }
.next { background: var(--chip); border-radius: 10px; padding: 10px 12px; margin-top: 14px; }
.next code { font: 0.82rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; overflow-x: auto; white-space: nowrap; flex: 1; }
.next .cmd { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.h3-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sv-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.sv-card h2 { font-size: 1.05rem; margin: 0 0 6px; }
.sv-card h3 { font-size: 0.92rem; margin: 12px 0 4px; }
.toc ol { margin: 0; padding-left: 20px; font-size: 0.9rem; } .toc li { margin: 2px 0; }
.ok { color: var(--good); font-weight: 600; } .err { color: var(--bad); font-weight: 600; }
.err-box { background: var(--warn-soft); color: var(--bad); border-radius: 8px; padding: 10px 12px; margin-top: 8px; white-space: pre-wrap; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 0.9rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.pill { display: inline-block; background: var(--chip); border-radius: 999px; padding: 0 8px; margin: 0 4px 3px 0; font-size: 0.82rem; }
.site-block { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
pre.json { font: 0.78rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--chip); border-radius: 6px; padding: 8px; overflow-x: auto; margin: 4px 0 8px; }
.ref table { font-size: 0.86rem; }
.ref code { font: 0.8rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--chip);
  border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.classes { width: 100%; border-collapse: collapse; }
.classes th { position: sticky; top: 0; background: var(--panel); text-align: left; }
.classes th, .classes td { padding: 4px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.classes tr.top td { font-weight: 600; background: var(--soft); }
.classes tr.sub td:first-child { padding-left: 26px; }
.ref input[type=search] { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 8px; margin: 6px 0; width: min(320px, 100%); }
.scroll { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 9px 16px; border-radius: 8px; z-index: 20; box-shadow: var(--shadow); max-width: 90vw; }
.toast.error { background: var(--bad); color: #fff; }
@media (max-width: 760px) {
  th.hide-sm, td.hide-sm { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Job Tracker</h1>
  <div class="pipeline" id="pipeline"></div>
  <span class="chip busy" id="scoring" hidden></span>
  <div class="save-bar">
    <span class="meta" id="unsaved"></span>
    <button class="btn" id="discard" disabled>Discard</button>
    <button class="btn primary" id="save" disabled>Save</button>
  </div>
</header>
<main>
  <div class="tabs">
    <button class="tab" data-view="inbox">Inbox<span class="count" id="inbox-count">0</span></button>
    <button class="tab" data-view="jobs">My jobs<span class="count" id="jobs-count">0</span></button>
    <button class="tab" data-view="filtered">Filtered</button>
    <button class="tab" data-view="not_interested">Not interested</button>
    <button class="tab" data-view="searches">Searches</button>
  </div>
  <div class="notice" id="cv-problem" role="alert" hidden></div>
  <div class="filters" id="filters">
    <details class="multi" id="status-filter">
      <summary id="status-summary">Statuses</summary>
      <div class="menu" id="status-menu"></div>
    </details>
    <select id="sort">
      <option value="score">Best match first</option><option value="posted">Newest posted</option>
      <option value="posted_asc">Oldest posted</option><option value="salary">Highest salary (USD)</option>
      <option value="salary_asc">Lowest salary (USD)</option>
      <option value="added">Recently added</option><option value="follow_up">Follow-up date</option>
    </select>
    <button class="btn" id="score-btn" disabled>Score all jobs</button>
    <button class="btn" id="rescore-btn" hidden>Rescore edited CVs</button>
    <a class="btn" id="export-all" href="#" title="Every job in this tab, whatever the filters">Export CSV (All)</a>
    <a class="btn" id="export-view" href="#" title="Only the jobs on this page">Export CSV (Filtered)</a>
    <span class="meta" id="shown"></span>
    <span class="pager" id="pager">
      <select id="page-size" aria-label="Jobs per page">
        <option value="5">5 per page</option><option value="10">10 per page</option>
        <option value="20">20 per page</option><option value="50">50 per page</option>
        <option value="100">100 per page</option>
      </select>
      <button class="btn small" id="page-prev" aria-label="Previous page">‹</button>
      <span class="meta" id="page-label"></span>
      <button class="btn small" id="page-next" aria-label="Next page">›</button>
    </span>
  </div>
  <div class="bulk" id="bulk" hidden></div>
  <div class="table-wrap" id="jobs-table"><table>
    <thead><tr><th class="sel" id="select-col"><input type="checkbox" id="select-all" aria-label="Select all jobs on this page"></th><th class="match-col">Match</th><th>Job</th><th class="hide-sm">Country</th><th class="hide-sm">Sites</th><th class="hide-sm"><button class="sort-head" data-sort="posted" title="Sort by posted date; click again to reverse">Posted</button></th>
      <th class="hide-sm"><button class="sort-head" data-sort="salary" title="Sort by salary in US dollars; click again to reverse">Salary</button></th><th>Status</th><th class="hide-sm fu-col">Follow up</th></tr>
    <tr class="col-filters"><th class="sel" id="select-col-filter"></th>
      <th class="match-col"><input type="number" id="f-score" min="0" max="100" step="5" placeholder="Min" aria-label="Minimum match score"></th>
      <th><input type="search" id="q" placeholder="Title, company, location" aria-label="Search title, company, location"></th>
      <th class="hide-sm"><details class="multi" id="country-filter"><summary id="country-summary">All</summary>
        <div class="menu" id="country-menu"></div></details></th>
      <th class="hide-sm"><details class="multi" id="site-filter"><summary id="site-summary">All</summary>
        <div class="menu" id="site-menu"></div></details></th>
      <th class="hide-sm"><select id="f-posted" aria-label="Posted" title="When the job was posted (or first seen, if the site gives no date)">
        <option value="">Any time</option><option value="1">Past day</option><option value="7">Past week</option>
        <option value="14">Past 2 weeks</option><option value="30">Past month</option><option value="older">Over a month ago</option></select></th>
      <th class="hide-sm"><input type="number" id="salary" min="0" step="5000" placeholder="Min USD / yr"
        aria-label="Minimum salary in US dollars per year"
        title="Each job's salary is converted to US dollars. Jobs without a listed salary are always kept"></th>
      <th></th><th class="hide-sm fu-col"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <section id="searches-view" hidden></section>
</main>
<aside class="drawer" id="drawer" hidden></aside>

<script src="/app.js"></script>
</body>
</html>
