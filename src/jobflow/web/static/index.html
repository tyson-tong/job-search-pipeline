<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Job Tracker</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --ink: #18202b; --muted: #5d6876; --line: #dde2e8;
  --accent: #1f5fae; --accent-ink: #fff; --soft: #e8effa; --dirty: #fff6dd; --dirty-line: #e7c35a;
  --warn: #a14e00; --warn-soft: #fdeede; --bad: #b3261e; --good: #2f7d43; --chip: #eef1f5;
  --shadow: 0 8px 30px #0f172a26;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121519; --panel: #1b2027; --ink: #e6e9ed; --muted: #9aa4b0; --line: #2e3640;
    --accent: #6ea6ee; --accent-ink: #0d1117; --soft: #1e2b3d; --dirty: #33291299; --dirty-line: #8a6d1f;
    --warn: #f0a560; --warn-soft: #3a2a18; --bad: #ff8a80; --good: #7fd08f; --chip: #252c35;
    --shadow: 0 8px 30px #0008;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
header h1 { font-size: 1.1rem; margin: 0 8px 0 0; }
.pipeline { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.chip { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 2px 10px;
  font-size: 0.82rem; }
.chip b { font-variant-numeric: tabular-nums; }
.chip.alert { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.save-bar { display: flex; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.small { padding: 2px 8px; font-size: 0.82rem; }
main { padding: 12px 16px 60px; max-width: 1500px; margin: 0 auto; }
.tabs { display: flex; gap: 4px; margin-bottom: 10px; }
.notice { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 8px;
  padding: 8px 12px; margin-bottom: 10px; }
.tab { border: 0; background: none; padding: 8px 14px; border-bottom: 2px solid transparent; font-weight: 600; color: var(--muted); }
.tab.on { color: var(--ink); border-color: var(--accent); }
.count { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; font-size: 0.75rem; margin-left: 4px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.filters input, .filters select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 9px; }
.filters input[type=search] { min-width: 220px; flex: 1; max-width: 360px; }
.pager { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
.pager[hidden] { display: none; }
details.multi { position: relative; }
details.multi summary { list-style: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
details.multi summary::-webkit-details-marker { display: none; }
details.multi .menu { position: absolute; z-index: 6; top: calc(100% + 4px); left: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: var(--shadow); min-width: 210px; }
details.multi label { display: flex; gap: 8px; padding: 4px 6px; border-radius: 6px; }
details.multi label:hover { background: var(--soft); }
.menu .row { display: flex; gap: 6px; margin-top: 6px; }
.meta { color: var(--muted); font-size: 0.85rem; }
.table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); background: var(--panel); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
/* Column filters: a second heading row, not sticky, with compact inputs. */
tr.col-filters th { position: static; padding-top: 0; text-transform: none; letter-spacing: 0; font-weight: normal; }
tr.col-filters input, tr.col-filters select { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--panel);
  border-radius: 6px; padding: 3px 5px; font-size: 0.82rem; }
tr.col-filters input[type=number] { min-width: 70px; }
tr.col-filters details.multi summary { padding: 3px 5px; font-size: 0.82rem; border-radius: 6px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
tr.col-filters details.multi .menu { max-height: 320px; overflow-y: auto; }
tr.col-filters .menu input[type=checkbox] { width: auto; }
tr.col-filters .menu label { white-space: nowrap; }
.sort-head { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.sort-head:hover { color: var(--accent); }
.sort-head.on { color: var(--ink); }
tr.dirty td { background: var(--dirty); }
tr.dirty td:first-child { box-shadow: inset 3px 0 0 var(--dirty-line); }
/* Similar jobs sit together: an orange bar marks similar jobs in one country, a blue one the
   same ad in another country, with a line above each set. */
tr.abroad td:first-child { border-left: 4px solid var(--accent); }
tr.grouped td:first-child { border-left: 4px solid var(--warn); }
tr.grouped.group-start td { border-top: 2px solid var(--warn); }
tr.abroad.area-start td { border-top: 2px solid var(--accent); }
.score { display: inline-block; min-width: 36px; text-align: center; border-radius: 6px; padding: 1px 6px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--chip); }
.score.hi { background: #d9f2df; color: #1d5e30; } .score.mid { background: #fdf1d4; color: #7a5300; } .score.lo { background: #f6dede; color: #8a1f1a; }
@media (prefers-color-scheme: dark) { .score.hi { background: #1f3b27; color: #9ee0ad; } .score.mid { background: #3b3119; color: #f3cf7a; } .score.lo { background: #3c2222; color: #ffb4ad; } }
.title-btn { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; color: var(--ink); }
.title-btn:hover { color: var(--accent); text-decoration: underline; }
.flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.flag { font-size: 0.72rem; border-radius: 4px; padding: 0 5px; background: var(--chip); color: var(--muted); }
.flag.warn { background: var(--warn-soft); color: var(--warn); }
.flag.bad { background: var(--warn-soft); color: var(--bad); font-weight: 600; }
.site { font-size: 0.72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 3px; }
td select, td input[type=date] { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 5px; }
.quick { display: flex; gap: 4px; flex-wrap: wrap; }
.btn.on { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
th.sel, td.sel { width: 1%; padding-right: 0; }
td.sel { cursor: pointer; user-select: none; }
/* Pinned to the bottom so it stays in reach while ticking rows down a long Inbox. */
.bulk { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 8; max-width: calc(100vw - 32px);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--accent);
  border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
/* Drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel);
  border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 10; overflow-y: auto; padding: 18px 20px 40px; }
.drawer[hidden] { display: none; }
.drawer h2 { margin: 0 30px 2px 0; font-size: 1.2rem; }
.drawer h3 { font-size: 0.95rem; margin: 18px 0 6px; }
.drawer-actions { position: sticky; bottom: -40px; margin: 20px -20px -40px; padding: 12px 20px;
  background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.close { position: absolute; top: 12px; right: 14px; border: 0; background: none; font-size: 1.4rem; line-height: 1; color: var(--muted); }
.edit { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; background: var(--soft); border-radius: 10px; padding: 12px; margin-top: 12px; }
.edit textarea { grid-column: 1 / -1; min-height: 70px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--panel); resize: vertical; }
.edit select, .edit input { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--panel); }
.banner { border-radius: 8px; padding: 8px 10px; margin-top: 10px; background: var(--warn-soft); color: var(--warn); }
.notes { white-space: pre-wrap; background: var(--chip); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; }
.match { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
.match ul { margin: 4px 0 0; padding-left: 18px; font-size: 0.86rem; }
.match .q { color: var(--muted); }
.history li, .dups li { margin: 3px 0; }
.description { white-space: pre-wrap; font-size: 0.88rem; max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.chip.busy { background: var(--soft); border-color: var(--accent); }
.next { background: var(--chip); border-radius: 10px; padding: 10px 12px; margin-top: 14px; }
.next code { font: 0.82rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; overflow-x: auto; white-space: nowrap; flex: 1; }
.next .cmd { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.h3-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sv-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.sv-card h2 { font-size: 1.05rem; margin: 0 0 6px; }
.sv-card h3 { font-size: 0.92rem; margin: 12px 0 4px; }
.ok { color: var(--good); font-weight: 600; } .err { color: var(--bad); font-weight: 600; }
.err-box { background: var(--warn-soft); color: var(--bad); border-radius: 8px; padding: 10px 12px; margin-top: 8px; white-space: pre-wrap; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 0.9rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.pill { display: inline-block; background: var(--chip); border-radius: 999px; padding: 0 8px; margin: 0 4px 3px 0; font-size: 0.82rem; }
.site-block { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
pre.json { font: 0.78rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--chip); border-radius: 6px; padding: 8px; overflow-x: auto; margin: 4px 0 8px; }
.ref table { font-size: 0.86rem; }
.ref code { font: 0.8rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--chip);
  border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.classes { width: 100%; border-collapse: collapse; }
.classes th { position: sticky; top: 0; background: var(--panel); text-align: left; }
.classes th, .classes td { padding: 4px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.classes tr.top td { font-weight: 600; background: var(--soft); }
.classes tr.sub td:first-child { padding-left: 26px; }
.ref input[type=search] { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 8px; margin: 6px 0; width: min(320px, 100%); }
.scroll { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 9px 16px; border-radius: 8px; z-index: 20; box-shadow: var(--shadow); max-width: 90vw; }
.toast.error { background: var(--bad); color: #fff; }
@media (max-width: 760px) {
  th.hide-sm, td.hide-sm { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Job Tracker</h1>
  <div class="pipeline" id="pipeline"></div>
  <span class="chip busy" id="scoring" hidden></span>
  <div class="save-bar">
    <span class="meta" id="unsaved"></span>
    <button class="btn" id="discard" disabled>Discard</button>
    <button class="btn primary" id="save" disabled>Save</button>
  </div>
</header>
<main>
  <div class="tabs">
    <button class="tab" data-view="inbox">Inbox<span class="count" id="inbox-count">0</span></button>
    <button class="tab" data-view="jobs">My jobs<span class="count" id="jobs-count">0</span></button>
    <button class="tab" data-view="filtered">Filtered</button>
    <button class="tab" data-view="searches">Searches</button>
  </div>
  <div class="notice" id="cv-problem" role="alert" hidden></div>
  <div class="filters" id="filters">
    <details class="multi" id="status-filter">
      <summary id="status-summary">Statuses</summary>
      <div class="menu" id="status-menu"></div>
    </details>
    <select id="sort">
      <option value="score">Best match first</option><option value="posted">Newest posted</option>
      <option value="posted_asc">Oldest posted</option><option value="salary">Highest salary (USD)</option>
      <option value="salary_asc">Lowest salary (USD)</option>
      <option value="added">Recently added</option><option value="follow_up">Follow-up date</option>
    </select>
    <button class="btn" id="score-btn" disabled>Score all jobs</button>
    <a class="btn" id="export-all" href="#" title="Every job in this tab, whatever the filters">Export CSV (All)</a>
    <a class="btn" id="export-view" href="#" title="Only the jobs on this page">Export CSV (Filtered)</a>
    <span class="meta" id="shown"></span>
    <span class="pager" id="pager">
      <select id="page-size" aria-label="Jobs per page">
        <option value="5">5 per page</option><option value="10">10 per page</option>
        <option value="20">20 per page</option><option value="50">50 per page</option>
        <option value="100">100 per page</option>
      </select>
      <button class="btn small" id="page-prev" aria-label="Previous page">‹</button>
      <span class="meta" id="page-label"></span>
      <button class="btn small" id="page-next" aria-label="Next page">›</button>
    </span>
  </div>
  <div class="bulk" id="bulk" hidden></div>
  <div class="table-wrap" id="jobs-table"><table>
    <thead><tr><th class="sel" id="select-col"><input type="checkbox" id="select-all" aria-label="Select all jobs on this page"></th><th class="match-col">Match</th><th>Job</th><th class="hide-sm">Country</th><th class="hide-sm">Sites</th><th class="hide-sm"><button class="sort-head" data-sort="posted" title="Sort by posted date; click again to reverse">Posted</button></th>
      <th class="hide-sm"><button class="sort-head" data-sort="salary" title="Sort by salary in US dollars; click again to reverse">Salary</button></th><th>Status</th><th class="hide-sm fu-col">Follow up</th></tr>
    <tr class="col-filters"><th class="sel" id="select-col-filter"></th>
      <th class="match-col"><input type="number" id="f-score" min="0" max="100" step="5" placeholder="Min" aria-label="Minimum match score"></th>
      <th><input type="search" id="q" placeholder="Title, company, location" aria-label="Search title, company, location"></th>
      <th class="hide-sm"><details class="multi" id="country-filter"><summary id="country-summary">All</summary>
        <div class="menu" id="country-menu"></div></details></th>
      <th class="hide-sm"><details class="multi" id="site-filter"><summary id="site-summary">All</summary>
        <div class="menu" id="site-menu"></div></details></th>
      <th class="hide-sm"><select id="f-posted" aria-label="Posted" title="When the job was posted (or first seen, if the site gives no date)">
        <option value="">Any time</option><option value="1">Past day</option><option value="7">Past week</option>
        <option value="14">Past 2 weeks</option><option value="30">Past month</option><option value="older">Over a month ago</option></select></th>
      <th class="hide-sm"><input type="number" id="salary" min="0" step="5000" placeholder="Min USD / yr"
        aria-label="Minimum salary in US dollars per year"
        title="Each job's salary is converted to US dollars. Jobs without a listed salary are always kept"></th>
      <th></th><th class="hide-sm fu-col"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <section id="searches-view" hidden></section>
</main>
<aside class="drawer" id="drawer" hidden></aside>

<script>
"use strict";
const TOKEN = "__JOBFLOW_TOKEN__";
const LABELS = { new: "New", interested: "Interested", not_interested: "Not interested", applied: "Applied",
  interviewing: "Interviewing", offered: "Offered", accepted: "Accepted", declined: "Declined",
  rejected: "Rejected", withdrawn: "Withdrawn", filtered: "Filtered" };
const SITE_NAMES = { linkedin: "LinkedIn", indeed: "Indeed", seek: "Seek" };
const AUTO_REFRESH_MS = 3 * 60 * 1000;
// versions: each edited job's tracking version when you started editing it, sent with
// Save so changes made elsewhere in the meantime are caught instead of overwritten.
const state = { view: "jobs", statuses: new Set(["interested", "applied", "interviewing", "offered", "accepted"]), jobs: [], summary: null,
  pending: new Map(), versions: new Map(), detail: null, loadedAt: null, scoring: null,
  // Rows ticked for a bulk change (Inbox triage, Filtered back to the Inbox); lastPicked anchors shift-click ranges.
  selected: new Set(), lastPicked: null,
  // Country and site filters: null for all, else the ticked ones (none ticked: no jobs); and
  // the countries and sites among this tab's jobs, with counts.
  countries: null, sites: null, countryCounts: null,
  // Paging splits the rows the filters returned (the filters themselves cover every job);
  // pageKey is the query they came from, so a new query starts again at page 1.
  page: 0, pageSize: 50, pageKey: null };
// A job still in the Inbox can only be triaged; the other statuses come after Interested.
const TRIAGE_STATUSES = ["new", "interested", "not_interested"];
// My jobs holds only jobs you picked as Interested and what followed; these never show there.
const NOT_MY_JOBS = ["new", "not_interested", "filtered"];
const PAGE_SIZES = [5, 10, 20, 50, 100];

// ---- Helpers -------------------------------------------------------------------------
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === undefined || value === null || value === false) continue;
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "className") node.className = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  return fill(node, children, false);
}
// Append children (nested arrays allowed), skipping null/undefined/false; text is never parsed as HTML.
function fill(node, children, replace = true) {
  const nodes = [children].flat(Infinity).filter((c) => c !== null && c !== undefined && c !== false)
    .map((c) => c instanceof Node ? c : document.createTextNode(String(c)));
  if (replace) node.replaceChildren(...nodes); else node.append(...nodes);
  return node;
}
const safeUrl = (url) => /^https?:\/\//i.test(url || "") ? url : null;
const label = (status) => LABELS[status] || status;
const fmtDate = (value) => value ? String(value).slice(0, 10) : "";
function fmtSalary(min, max, currency) {
  if (min == null) return "";
  const k = (n) => `${Math.round(n / 1000)}k`;
  return (min === max ? k(min) : `${k(min)}–${k(max)}`) + (currency ? ` ${currency}` : "") + " /yr";
}
function toast(message, isError = false) {
  const node = el("div", { className: "toast" + (isError ? " error" : ""), role: "status" }, message);
  document.body.append(node);
  setTimeout(() => node.remove(), isError ? 7000 : 3000);
}
async function api(path, options = {}) {
  const response = await fetch(path, { ...options,
    headers: { "X-Jobflow-Token": TOKEN, ...(options.headers || {}) } });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw Object.assign(new Error(data.error || `Request failed (${response.status})`),
      { status: response.status, data });
  }
  return data;
}
function remember() {
  try { localStorage.setItem("jobflow.filters", JSON.stringify({ statuses: [...state.statuses],
    sort: sortInput.value, sites: state.sites && [...state.sites], view: state.view, pageSize: state.pageSize })); } catch (e) { /* optional */ }
}
function recall() {
  try {
    const saved = JSON.parse(localStorage.getItem("jobflow.filters") || "null");
    if (!saved) return;
    const statuses = Array.isArray(saved.statuses) ? saved.statuses.filter((s) => !NOT_MY_JOBS.includes(s)) : [];
    if (Array.isArray(saved.statuses)) state.statuses = new Set(statuses);
    if (saved.sort) sortInput.value = saved.sort;
    if (Array.isArray(saved.sites)) state.sites = new Set(saved.sites.filter((s) => s in SITE_NAMES));
    else if (saved.site in SITE_NAMES) state.sites = new Set([saved.site]);  // saved when one site was picked
    if (saved.view) state.view = saved.view;
    if (PAGE_SIZES.includes(saved.pageSize)) state.pageSize = saved.pageSize;
  } catch (e) { /* optional */ }
}

// ---- Pending (unsaved) changes ---------------------------------------------------------
function current(job, field) {
  const pending = state.pending.get(job.id);
  return pending && field in pending ? pending[field] : job[field];
}
function setPending(job, field, value) {
  stagePending(job, field, value);
  renderSaveBar();
  renderRows();
  // Rebuilding the drawer while typing a note would lose the cursor.
  if (field !== "note" && state.detail && state.detail.id === job.id) renderDetail();
}
function stagePending(job, field, value) {
  const pending = { ...(state.pending.get(job.id) || {}) };
  const original = field === "note" ? "" : (job[field] ?? (field === "follow_up_on" ? "" : null));
  if ((value ?? "") === (fmtDate(original) || original || "")) delete pending[field];
  else pending[field] = value;
  if (Object.keys(pending).length) {
    state.pending.set(job.id, pending);
    if (!state.versions.has(job.id) && job.version) state.versions.set(job.id, job.version);
  } else {
    state.pending.delete(job.id);

    const rowId = state.jobs[i] && state.jobs[i].id;

  const button = document.getElementById("score-btn"), chip = document.getElementById("scoring");
  const running = state.scoring && state.scoring.running;
  const { unscored, cv_count: cvs, scoring_problem: problem } = state.summary || {};
  // Interested jobs, the only ones scored, live in My jobs: saving one moves it out of the Inbox.
  button.hidden = state.view !== "jobs";
  button.disabled = running || !unscored;
  // Only a configuration problem needs explaining, usually the CVs chosen in
  // config/profile.toml; it stops tailor-cv, cover-letter, skill-gaps, and interview-prep too.
  button.title = problem ? `Scoring unavailable: ${problem}` : "";
  const notice = document.getElementById("cv-problem");
  notice.hidden = !problem;
  if (problem) fill(notice, [el("strong", {}, "Scoring, tailor-cv, cover-letter, skill-gaps, and interview-prep can't run: "), problem]);
  chip.hidden = !running;
  if (running) chip.textContent = `Scoring ${state.scoring.done} / ${state.scoring.total}…`;
}
async function startScoring(body, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  try {
    state.scoring = await api("/api/scoring", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    renderScoring();
    if (state.scoring.running) pollScoring();
    else toast("Nothing to score.");
  } catch (error) { toast(error.message, true); }
}
async function pollScoring() {
  try { state.scoring = await api("/api/scoring"); } catch (error) { toast(error.message, true); return; }
  renderScoring();
  if (state.scoring.running) { setTimeout(pollScoring, 2000); return; }
  const { scored, errors, done, total } = state.scoring;
  toast(`Scored ${scored.length} job${scored.length === 1 ? "" : "s"}` + (errors.length
    ? `; ${errors.length} failed (${errors[0].error})` : "")
    + (done < total ? `. Stopped: the other ${total - done} would fail the same way` : ""), errors.length > 0);
  await refresh();  // unsaved drafts are kept; rows just gain their new scores
  if (state.detail && !state.pending.size) await openDetail(state.detail.id);
}
document.getElementById("score-btn").addEventListener("click", () => {
  const jobs = state.summary.unscored, cvs = state.summary.cv_count;
  startScoring({}, `Score ${jobs} interested job${jobs === 1 ? "" : "s"} against your ${cvs} CV${cvs === 1 ? "" : "s"}?`
    + `\n\nThis makes about ${jobs * cvs} LLM call${jobs * cvs === 1 ? "" : "s"}, newest jobs first. You can keep working while it runs.`);
});
async function copyCommand(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied: " + text); }
  catch (error) { toast("Copy failed; select the command and copy it instead.", true); }
}

// ---- Searches (config/searches.toml: what the daily import runs) ---------------------------------
const siteName = (s) => SITE_NAMES[s] || s;
function renderSearches() {
  const data = state.searches, box = document.getElementById("searches-view");
  const header = el("div", { className: "sv-card" },
    el("h2", {}, "Your searches"),
    el("div", {}, data.ok ? el("span", { className: "ok" }, "✓ Valid") : el("span", { className: "err" }, "✗ Can't be used"),
      el("span", { className: "meta" }, `  ·  from ${data.source || "(no config/profile.toml)"}`), "  ",
      el("button", { className: "btn small", onclick: () => refresh().then(() => toast("Searches reloaded")) }, "Reload")),
    data.ok ? el("p", { className: "meta", style: "margin:8px 0 0" },
      `${data.total_runs} Apify run${data.total_runs === 1 ? "" : "s"} per import, at most ${data.total_max_results} results. `
      + "Actors charge per result. Nothing runs from this page.") : null,
    data.error ? el("div", { className: "err-box" }, data.error) : null,
    el("div", { className: "next" }, el("strong", {}, "To change your searches"),
      el("p", { className: "meta", style: "margin:4px 0" },
        "Edit the file in your editor, then click Reload to check it. After each change, run this: it checks "
        + "the file, updates the copy the daily GitHub run uses, and filters Inbox jobs from your excluded employers or matching your excluded titles:"),
      el("div", { className: "cmd" }, el("code", {}, "uv run jobflow update-searches"),
        el("button", { className: "btn small", onclick: () => copyCommand("uv run jobflow update-searches") }, "Copy")),
      el("div", { className: "cmd" }, el("code", {}, "uv run jobflow ingest --site seek"),
        el("button", { className: "btn small", onclick: () => copyCommand("uv run jobflow ingest --site seek") }, "Copy")),
      el("p", { className: "meta", style: "margin:4px 0 0" }, "The last command runs the searches now (one site here) instead of waiting for the daily run; it costs Apify credits.")));
  fill(box, [header, data.searches.map(renderSearchCard), renderReference(data.reference)]);
}
function renderSearchCard(search) {
  const salary = search.salary_min != null || search.salary_max != null
    ? `${search.salary_min ?? "any"} – ${search.salary_max ?? "any"} (${search.salary_period}); jobs without a salary are kept` : "any";
  const item = (label, value) => [el("dt", {}, label), el("dd", {}, value)];
  return el("div", { className: "sv-card" },
    el("h2", {}, search.name),
    el("dl", { className: "kv" },
      item("Terms", search.terms.map((t) => el("span", { className: "pill" }, t))),
      item("Locations", Object.entries(search.locations).map(([country, cities]) =>
        el("span", { className: "pill" }, `${country}: ${cities.length ? cities.join(", ") : "whole country"}`))),
      item("Posted within", search.posted_within),
      item("Results", `up to ${search.max_results} per run` + (search.max_cost_usd ? `, cost cap $${search.max_cost_usd} per run` : "")
        + (search.radius_km ? `, ${search.radius_km} km radius` : "")),
      item("Salary", salary),
      item("Job types", search.job_types.length ? search.job_types.join(", ") : "any"),
      item("Work arrangements", search.work_arrangements.length ? search.work_arrangements.join(", ") : "any"),
      item("Seek classifications", search.seek_classifications.length ? search.seek_classifications.join(", ") : "any"),
      item("Excluded titles", search.exclude_title_terms.length
        ? search.exclude_title_terms.map((t) => el("span", { className: "pill" }, t)) : "none"),
      item("Kept titles", search.include_title_terms.length
        ? [search.include_title_terms.map((t) => el("span", { className: "pill" }, t)),
           el("span", { className: "meta" }, " (override excluded titles)")] : "none"),
      item("Excluded employers", search.exclude_companies.length
        ? search.exclude_companies.map((t) => el("span", { className: "pill" }, t)) : "none")),
    search.sites.map((site) => el("div", { className: "site-block" },
      el("strong", {}, siteName(site.site)),
      el("span", { className: "meta" }, ` · ${site.runs.length} run${site.runs.length === 1 ? "" : "s"}, up to ${site.max_results_per_run} results each`
        + (site.local_filters.length ? ` · filtered after import by ${site.local_filters.join(", ").replace(/_/g, " ")}` : "")),
      site.notes.map((note) => el("div", { className: "flags" }, el("span", { className: "flag warn" }, note))),
      el("details", {}, el("summary", { className: "meta" }, `Show the exact input sent to ${site.actor}`),
        site.runs.map((r) => [el("div", { className: "meta" }, r.label),
          el("pre", { className: "json" }, JSON.stringify(r.input, null, 2))])))));
}
function renderReference(ref) {
  const table = (head, rows) => el("div", { className: "table-wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, head.map((h) => el("th", {}, h)))),
    el("tbody", {}, rows.map((r) => el("tr", {}, r.map((c) => el("td", {}, c)))))));
  const filterNames = Object.keys(ref.filter_support[ref.sites[0]]);
  // One row per classification (in bold, covering all its subclassifications), then a row
  // per subclassification: the key to use in searches.toml, and the name Seek shows.
  const classList = el("tbody");
  const drawClasses = (q) => fill(classList, ref.seek_classifications.map((c) => {
    const subs = c.subclassifications.filter((sc) => !q || `${sc.key} ${sc.name}`.toLowerCase().includes(q));
    const own = !q || `${c.key} ${c.name}`.toLowerCase().includes(q);
    if (!own && !subs.length) return null;
    return [el("tr", { className: "top" }, el("td", {}, el("code", {}, c.key)),
        el("td", {}, c.name, el("span", { className: "meta" }, " (all subclassifications)"))),
      (own && !q ? c.subclassifications : subs).map((sc) =>
        el("tr", { className: "sub" }, el("td", {}, el("code", {}, sc.key)), el("td", {}, sc.name)))];
  }));
  drawClasses("");
  return el("div", { className: "sv-card ref" },
    el("h2", {}, "Allowed values"),
    el("dl", { className: "kv" },
      [["sites", ref.sites], ["job_types", ref.job_types], ["work_arrangements", ref.work_arrangements],
       ["salary_period", ref.salary_periods]].map(([k, v]) => [el("dt", {}, el("code", {}, k)), el("dd", {}, v.join(", "))])),
    el("h3", {}, "posted_within_days"),
    table(["Value", ...ref.sites.map(siteName)], ref.posted_within.map((w) =>
      [`${w.days} (${w.name})`, ...ref.sites.map((s) => w.sites[s] ? "✓" : "wider, then filtered")])),
    el("h3", {}, "How each site applies each setting"),
    el("p", { className: "meta", style: "margin:0 0 4px" }, "search: the site filters before you pay · local: filtered after import, only when the job's value is known · unsupported: not available"),
    table(["Setting", ...ref.sites.map(siteName)], filterNames.map((f) =>
      [f.replace(/_/g, " "), ...ref.sites.map((s) => ref.filter_support[s][f])])),
    el("h3", {}, "locations: countries and cities"),
    el("p", { className: "meta", style: "margin:0 0 4px" }, "Use [] for the whole country. UK also works for GB."),
    table(["Code", "Country", "Cities", "Sites"], ref.countries.map((c) =>
      [el("code", {}, c.code), c.name, c.cities.join(", "), c.sites.map(siteName).join(", ")])),
    el("details", {}, el("summary", {}, el("strong", {}, "seek_classifications (Seek only)")),
      el("input", { type: "search", placeholder: "Filter classifications", oninput: (e) => drawClasses(e.target.value.toLowerCase()) }),
      el("div", { className: "scroll" }, el("table", { className: "classes" },
        el("thead", {}, el("tr", {}, el("th", {}, "Key (in searches.toml)"), el("th", {}, "Name on Seek"))),
        classList))));
}

// ---- Detail drawer -----------------------------------------------------------------------
async function openDetail(id) {
  try {
    const drawer = document.getElementById("drawer");
    const sameJob = state.detail && state.detail.id === id;
    const scroll = sameJob ? drawer.scrollTop : 0;
    state.detail = await api(`/api/jobs/${id}`);
    renderDetail();
    drawer.scrollTop = scroll;  // a refresh of the same job keeps your place
  } catch (error) { toast(error.message, true); }
}
function closeDetail() { state.detail = null; document.getElementById("drawer").hidden = true; }
function renderDetail() {
  const job = state.detail;
  const listed = state.jobs.find((j) => j.id === job.id);
  // Edits go through the same pending changes as the table, using the list row if shown.
  const target = listed || { ...job, duplicates: job.duplicates, duplicate_in_progress: null };
  const drawer = document.getElementById("drawer");
  const inProgress = job.duplicates.filter((d) => ["applied", "interviewing", "offered", "accepted"].includes(d.status));
  drawer.hidden = false;
  fill(drawer, [
    el("button", { className: "close", "aria-label": "Close", onclick: closeDetail }, "×"),
    el("h2", {}, job.title),
    el("div", { className: "meta" }, [job.company, job.location, fmtSalary(job.salary_min, job.salary_max, job.currency)]
      .filter(Boolean).join(" · ")),
    el("div", { className: "meta" }, `Posted ${fmtDate(job.posted_at) || "unknown"} · added ${fmtDate(job.first_seen_at)}`
      + (job.applied_at ? ` · applied ${fmtDate(job.applied_at)}` : "")),
    el("div", { className: "flags", style: "margin-top:8px" }, job.sources.map((s) => safeUrl(s.url)
      ? el("a", { className: "btn small", href: safeUrl(s.url), target: "_blank", rel: "noopener noreferrer" },
          `Open on ${SITE_NAMES[s.source] || s.source} ↗`)
      : el("span", { className: "flag" }, SITE_NAMES[s.source] || s.source))),
    inProgress.length > 0 && ["interested", "applied"].includes(current(target, "status"))
      ? el("div", { className: "banner" }, `This may be the same role as job #${inProgress[0].id} `
          + `(${inProgress[0].company || "unknown employer"}), which is already ${label(inProgress[0].status).toLowerCase()}.`)
      : null,
    job.status === "filtered" && job.filter_reason ? el("div", { className: "banner" }, `Filtered on import: ${job.filter_reason}`) : null,
    el("div", { className: "edit" },
      el("label", { for: "d-status" }, "Status"),
      Object.assign(statusSelect(target), { id: "d-status" }),
      el("label", { for: "d-follow" }, "Follow up"),
      el("input", { id: "d-follow", type: "date", value: current(target, "follow_up_on") ? fmtDate(current(target, "follow_up_on")) : "",
        onchange: (event) => setPending(target, "follow_up_on", event.target.value) }),
      el("textarea", { placeholder: "Add a note (dated when saved), e.g. spoke to recruiter, salary discussed…",
        maxlength: 2000, oninput: (event) => setPending(target, "note", event.target.value) },
        current(target, "note") || "")),
    job.notes ? [el("h3", {}, "Notes"), el("div", { className: "notes" }, job.notes)] : null,
    // Only a saved Interested job is scored, and only once.
    el("div", { className: "h3-row" }, el("h3", {}, "Match with your CVs"),
      job.status === "interested" && !job.matches.length
        ? el("button", { className: "btn small", disabled: Boolean(state.scoring && state.scoring.running),
            title: "Ask the LLM to compare this job with each CV", onclick: () =>
              startScoring({ job_ids: [job.id] }) }, "Score")
        : null),
    job.matches.length ? job.matches.map(renderMatch)
      : el("p", { className: "meta" }, job.status === "interested" ? "Not scored yet."
          : "Not scored: only interested jobs are scored. Mark it interested and save to score it."),
    el("div", { className: "next" }, el("strong", {}, "Next steps (in a terminal)"),
      [["uv run jobflow tailor-cv", "Tailored CV drafts"],
       ["uv run jobflow cover-letter", "Cover letters (optional)"],
       ["uv run jobflow interview-prep", "Interview briefings"]].map(([command, what]) =>
        el("div", { className: "cmd" }, el("span", { className: "meta", style: "min-width:120px" }, what),
          el("code", {}, command), el("button", { className: "btn small", onclick: () => copyCommand(command) }, "Copy")))),
    similarList("Highly similar jobs", job.duplicates.filter((d) => d.level === "highly similar")),
    similarList("Similar jobs", job.duplicates.filter((d) => d.level !== "highly similar")),
    similarList("Same ad in other countries", job.elsewhere),
    job.history.length ? [el("h3", {}, "Status history"),
      el("ul", { className: "history" }, job.history.map((h) => el("li", { className: "meta" },
        `${fmtDate(h.changed_at)}: ${label(h.from_status || "new")} → ${label(h.to_status)} (${h.via})`)))] : null,
    job.description ? [el("h3", {}, "Job description"), el("div", { className: "description" }, job.description)] : null,
    el("div", { className: "drawer-actions" },
      el("span", { className: "meta", id: "d-unsaved" }),
      el("button", { className: "btn", onclick: closeDetail }, "Close"),
      el("button", { className: "btn primary", id: "d-save", onclick: () => save() }, "Save"))]);
  renderSaveBar();
}
function similarList(title, jobs) {
  return jobs.length ? [el("h3", {}, title),
    el("ul", { className: "dups" }, jobs.map((d) => el("li", {},
      el("button", { className: "title-btn", onclick: () => openDetail(d.id) }, `#${d.id} ${d.title}`),
      el("span", { className: "meta" }, ` — ${[d.company, d.location].filter(Boolean).join(", ")}, `
        + `${label(d.status)}, title ${Math.round(d.title_similarity * 100)}% and ad ${Math.round(d.similarity * 100)}% alike`))))] : null;
}
function renderMatch(m) {
  const items = (title, list, withQuotes) => list.length ? [el("div", { className: "meta", style: "margin-top:6px" }, title),
    el("ul", {}, list.map((r) => el("li", {}, `[${r.importance}] ${r.requirement}`,
      withQuotes && r.evidence && r.evidence.length ? el("span", { className: "q" }, ` — “${r.evidence.join("”; “")}”`) : null,
      r.note ? el("span", { className: "q" }, ` (${r.note})`) : null)))] : null;
  return el("div", { className: "match" },
    el("strong", {}, `${m.variant}: ${Math.round(m.score)}/100`),
    m.rationale ? el("div", { className: "meta" }, m.rationale) : null,
    items("Matched", m.matched, true), items("Partial", m.partial, true),
    items("Not evidenced in this CV (not proof you lack it)", m.not_evidenced, false));
}

// ---- Wiring ----------------------------------------------------------------------------
document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => {
  state.view = tab.dataset.view; remember(); refresh(); }));
let searchTimer;
qInput.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(refresh, 250); });
salaryInput.addEventListener("change", refresh);
COLUMN_FILTERS.forEach(([input]) => input.addEventListener("change", refresh));
sortInput.addEventListener("change", () => { remember(); refresh(); });
document.getElementById("page-size").addEventListener("change", (event) => {
  // Keep the first row you were looking at on screen.
  const top = pageStarts()[state.page];
  state.pageSize = Number(event.target.value); remember();
  const starts = pageStarts();
  goToPage(Math.max(0, starts.findLastIndex((start) => start <= top)));
});
document.getElementById("page-prev").addEventListener("click", () => goToPage(state.page - 1));
document.getElementById("page-next").addEventListener("click", () => goToPage(state.page + 1));
// Clicking the Posted or Salary heading sorts by it (newest or highest first); clicking the
// same heading again reverses the order.
document.querySelectorAll(".sort-head").forEach((head) => head.addEventListener("click", () => {
  const desc = head.dataset.sort, asc = `${desc}_asc`;
  sortInput.value = sortInput.value === desc ? asc : desc;
  remember(); refresh();
}));
document.getElementById("save").addEventListener("click", () => save());
document.getElementById("discard").addEventListener("click", () => {
  if (confirm("Discard all unsaved changes?")) {
    state.pending.clear(); state.versions.clear(); renderAll(); if (state.detail) renderDetail();
  } });
// Keep the view current without disturbing edits: refresh when you come back to the
// tab and every few minutes, but never while there are unsaved changes.
async function autoRefresh() {
  if (document.hidden || state.pending.size) return;
  await refresh();
  if (state.detail && !state.pending.size) await openDetail(state.detail.id);
}
setInterval(autoRefresh, AUTO_REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) autoRefresh(); });
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeDetail();
  if ((event.ctrlKey || event.metaKey) && event.key === "s") { event.preventDefault(); if (state.pending.size) save(); }
});
document.addEventListener("click", (event) => {
  document.querySelectorAll("details.multi[open]").forEach((menu) => {
    if (!menu.contains(event.target)) menu.open = false; });
});
recall();
refresh().then(async () => {
  try { state.scoring = await api("/api/scoring"); } catch (error) { return; }
  renderScoring();
  if (state.scoring.running) pollScoring();
});
</script>
</body>
