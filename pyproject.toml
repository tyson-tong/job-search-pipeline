[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-workflow"
version = "0.1.0"
description = "Private job discovery, CV matching, and interview preparation workflow"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
  "apify-client>=3.2,<4",
  "psycopg-pool>=3.2,<4",
]

[dependency-groups]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2", "rendercv[full]==2.8"]

[tool.uv]
default-groups = ["documents"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
jobflow = "jobflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobflow = ["migrations/*.sql", "web/static/*", "ingest/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
# The width the code is written to; it decides how the import sorter wraps long imports.
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Lint only; the code isn't reformatted. Unused imports and undefined names (F), syntax
# errors (E9), likely bugs (B), and import order (I).
select = ["F", "E9", "B", "I"]

[tool.ruff.lint.isort]
# Imports that fit on one line go on one line.
split-on-trailing-comma = false
