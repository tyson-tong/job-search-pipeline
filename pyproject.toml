[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-workflow"
version = "0.1.0"
description = "Private job discovery, CV matching, and interview preparation workflow"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
  "apify-client>=3.2,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "fpdf2>=2.8,<3",
]

[project.optional-dependencies]
documents = ["rendercv[full]==2.8"]
test = ["pytest>=8"]

[project.scripts]
jobflow = "jobflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobflow = ["migrations/*.sql", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
